[project]
name = "live-fact-checker"
version = "0.2.0"
description = "Live Fact Checker — Nebius Token Factory · Nemotron-3.5-Lightning · MiniMax-M3 · Tavily"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.5.9",
    "flask>=3.0",
    "langchain-nebius>=0.1.3",
    "langchain-tavily>=0.2.18",
    "markdownify>=1.2.2",
    "numpy>=1.26",
    "openai>=1.0",
    "python-dotenv>=1.2.2",
    "scipy>=1.13",
    "sounddevice>=0.4",
    "tavily-python>=0.7.24",
]

[tool.setuptools]
packages = ["research_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
